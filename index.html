<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Asistente">
<title>Mi Asistente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c26;
    --border: #2a2a3a;
    --accent: #7c6af7;
    --accent2: #a78bfa;
    --text: #e8e8f0;
    --text2: #8888aa;
    --text3: #55556a;
    --user-bubble: #1e1b4b;
    --ai-bubble: #13131a;
    --danger: #f87171;
    --success: #34d399;
    --record: #f43f5e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: fixed;
    width: 100%;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    flex-shrink: 0;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--success);
    animation: pulse-dot 2s ease-in-out infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.85); }
  }

  .header-title {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.01em;
  }

  .header-subtitle {
    font-size: 11px;
    color: var(--text3);
    font-family: 'DM Mono', monospace;
  }

  .settings-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text2);
    width: 34px;
    height: 34px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .settings-btn:active { background: var(--surface2); }

  /* Chat area */
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    -webkit-overflow-scrolling: touch;
  }

  .chat::-webkit-scrollbar { display: none; }

  /* Mensajes */
  .msg {
    display: flex;
    flex-direction: column;
    max-width: 88%;
    animation: msg-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes msg-in {
    from { opacity: 0; transform: translateY(10px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.ai   { align-self: flex-start; align-items: flex-start; }

  .bubble {
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg.user .bubble {
    background: var(--user-bubble);
    border: 1px solid #312e81;
    border-bottom-right-radius: 4px;
    color: #c4b5fd;
  }

  .msg.ai .bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    color: var(--text);
  }

  .msg-time {
    font-size: 10px;
    color: var(--text3);
    margin-top: 4px;
    font-family: 'DM Mono', monospace;
    padding: 0 4px;
  }

  /* Indicador escribiendo */
  .typing-indicator {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 14px 16px;
  }

  .typing-indicator span {
    width: 6px;
    height: 6px;
    background: var(--text3);
    border-radius: 50%;
    animation: typing 1.2s ease-in-out infinite;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* Mensaje de bienvenida */
  .welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    gap: 12px;
    padding: 40px 20px;
    text-align: center;
  }

  .welcome-icon {
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, var(--accent), #4f46e5);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin-bottom: 8px;
    box-shadow: 0 0 40px rgba(124, 106, 247, 0.3);
  }

  .welcome h2 {
    font-size: 20px;
    font-weight: 500;
    color: var(--text);
  }

  .welcome p {
    font-size: 14px;
    color: var(--text2);
    max-width: 280px;
    line-height: 1.6;
  }

  .welcome-tips {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 8px;
    width: 100%;
    max-width: 300px;
  }

  .tip {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--text2);
    text-align: left;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tip:active { background: var(--surface2); color: var(--text); }

  /* Input area */
  .input-area {
    padding: 12px 16px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    background: var(--bg);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .input-row {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 8px 8px 16px;
    transition: border-color 0.2s;
  }

  .input-row:focus-within {
    border-color: var(--accent);
  }

  textarea {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    line-height: 1.5;
    resize: none;
    max-height: 120px;
    min-height: 24px;
    padding: 2px 0;
    -webkit-appearance: none;
  }

  textarea::placeholder { color: var(--text3); }

  .btn-voice {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: var(--surface2);
    color: var(--text2);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .btn-voice.recording {
    background: var(--record);
    color: white;
    animation: pulse-record 1s ease-in-out infinite;
  }

  @keyframes pulse-record {
    0%, 100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.4); }
    50% { box-shadow: 0 0 0 8px rgba(244, 63, 94, 0); }
  }

  .btn-send {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
  }

  .btn-send:disabled {
    background: var(--surface2);
    color: var(--text3);
  }

  .btn-send:not(:disabled):active {
    transform: scale(0.92);
    background: #6d5ce6;
  }

  /* Indicador de grabación */
  .recording-bar {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: rgba(244, 63, 94, 0.1);
    border: 1px solid rgba(244, 63, 94, 0.3);
    border-radius: 12px;
    margin-bottom: 10px;
    font-size: 13px;
    color: var(--record);
  }

  .recording-bar.active { display: flex; }

  .rec-dot {
    width: 8px;
    height: 8px;
    background: var(--record);
    border-radius: 50%;
    animation: pulse-dot 0.8s ease-in-out infinite;
    flex-shrink: 0;
  }

  /* Modal de configuración */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
    backdrop-filter: blur(4px);
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px 24px 0 0;
    padding: 24px 20px;
    padding-bottom: max(24px, env(safe-area-inset-bottom));
    width: 100%;
    max-width: 480px;
    animation: slide-up 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes slide-up {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }

  .modal-handle {
    width: 36px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 20px;
  }

  .modal h3 {
    font-size: 17px;
    font-weight: 500;
    margin-bottom: 20px;
  }

  .field {
    margin-bottom: 16px;
  }

  .field label {
    display: block;
    font-size: 12px;
    color: var(--text2);
    font-family: 'DM Mono', monospace;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .field input, .field select, .field textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    outline: none;
    -webkit-appearance: none;
  }

  .field input:focus, .field select:focus {
    border-color: var(--accent);
  }

  .field input[type="password"] {
    letter-spacing: 0.1em;
  }

  .field select option { background: var(--surface); }

  .btn-save {
    width: 100%;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 14px;
    padding: 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 8px;
    transition: all 0.2s;
  }

  .btn-save:active { transform: scale(0.98); background: #6d5ce6; }

  .btn-cancel {
    width: 100%;
    background: none;
    color: var(--text2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    cursor: pointer;
    margin-top: 10px;
  }

  /* Toast */
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 13px;
    z-index: 200;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    white-space: nowrap;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Audio player */
  .audio-play-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--accent2);
    cursor: pointer;
    margin-top: 6px;
    padding: 4px 8px;
    background: rgba(124, 106, 247, 0.1);
    border-radius: 8px;
    border: none;
    font-family: 'DM Sans', sans-serif;
  }

  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: inline-block;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <div class="status-dot" id="statusDot"></div>
    <div>
      <div class="header-title">Mi Asistente</div>
      <div class="header-subtitle" id="statusText">listo</div>
    </div>
  </div>
  <button class="settings-btn" onclick="openSettings()">⚙️</button>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Chat -->
<div class="chat" id="chat">
  <div class="welcome" id="welcome">
    <div class="welcome-icon">🤖</div>
    <h2>Hola, soy tu asistente</h2>
    <p>Habla conmigo o escribe. Puedo ayudarte con todo lo que necesites.</p>
    <div class="welcome-tips">
      <div class="tip" onclick="sendQuickMsg('¿Qué puedes hacer por mí?')">💡 ¿Qué puedes hacer por mí?</div>
      <div class="tip" onclick="sendQuickMsg('Hoy tengo que...')">📋 Hoy tengo que...</div>
      <div class="tip" onclick="sendQuickMsg('Ayúdame a organizar mi semana')">📅 Ayúdame a organizar mi semana</div>
    </div>
  </div>
</div>

<!-- Input area -->
<div class="input-area">
  <div class="recording-bar" id="recordingBar">
    <div class="rec-dot"></div>
    <span id="recordingText">Escuchando... suelta para enviar</span>
  </div>
  <div class="input-row">
    <textarea 
      id="textInput" 
      placeholder="Escribe un mensaje..." 
      rows="1"
      onInput="autoResize(this); updateSendBtn()"
      onKeydown="handleKey(event)"
    ></textarea>
    <button class="btn-voice" id="voiceBtn" 
      ontouchstart="startRecording(event)" 
      ontouchend="stopRecording(event)"
      onmousedown="startRecording(event)"
      onmouseup="stopRecording(event)">
      🎙️
    </button>
    <button class="btn-send" id="sendBtn" onclick="sendMessage()" disabled>
      ↑
    </button>
  </div>
</div>

<!-- Modal configuración -->
<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>⚙️ Configuración</h3>

    <div class="field">
      <label>API Key de Anthropic (Claude)</label>
      <input type="password" id="claudeKey" placeholder="sk-ant-..." autocomplete="off" autocorrect="off">
    </div>

    <div class="field">
      <label>API Key de OpenAI (voz)</label>
      <input type="password" id="openaiKey" placeholder="sk-..." autocomplete="off" autocorrect="off">
    </div>

    <div class="field">
      <label>Personalidad del asistente</label>
      <textarea id="systemPrompt" rows="4" style="resize:none; border-radius:10px; padding:12px 14px; font-size:13px; line-height:1.5; color:var(--text); background:var(--bg); border:1px solid var(--border); outline:none; width:100%; font-family:'DM Mono',monospace;">Eres mi asistente personal. Me llamo [tu nombre]. Soy profesor, tengo una ONG y trabajo en SEO. Eres directo, práctico y me hablas en español. Cuando te dé accesos a herramientas, los usas para ayudarme de verdad en mi día a día.</textarea>
    </div>

    <div class="field">
      <label>Voz de respuesta</label>
      <select id="voiceSelect">
        <option value="nova">Nova (clara y agradable)</option>
        <option value="alloy">Alloy (neutra)</option>
        <option value="echo">Echo (masculina)</option>
        <option value="fable">Fable (expresiva)</option>
        <option value="onyx">Onyx (grave)</option>
        <option value="shimmer">Shimmer (suave)</option>
      </select>
    </div>

    <button class="btn-save" onclick="saveSettings()">Guardar configuración</button>
    <button class="btn-cancel" onclick="closeSettings()">Cancelar</button>
  </div>
</div>

<script>
// ─── Estado ───────────────────────────────────────────────
let config = {
  claudeKey: '',
  openaiKey: '',
  systemPrompt: document.getElementById('systemPrompt').value,
  voice: 'nova'
};

let messages = [];
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
let isProcessing = false;
let currentAudio = null;

// ─── Inicio ───────────────────────────────────────────────
function init() {
  loadConfig();
  if (!config.claudeKey) {
    setTimeout(() => {
      showToast('👆 Toca ⚙️ para añadir tus claves API');
      openSettings();
    }, 1000);
  }
}

// ─── Configuración ────────────────────────────────────────
function loadConfig() {
  try {
    const saved = JSON.parse(localStorage.getItem('asistente_config') || '{}');
    config = { ...config, ...saved };
    document.getElementById('claudeKey').value = config.claudeKey || '';
    document.getElementById('openaiKey').value = config.openaiKey || '';
    document.getElementById('systemPrompt').value = config.systemPrompt;
    document.getElementById('voiceSelect').value = config.voice || 'nova';
  } catch(e) {}
}

function saveSettings() {
  config.claudeKey = document.getElementById('claudeKey').value.trim();
  config.openaiKey = document.getElementById('openaiKey').value.trim();
  config.systemPrompt = document.getElementById('systemPrompt').value.trim();
  config.voice = document.getElementById('voiceSelect').value;
  localStorage.setItem('asistente_config', JSON.stringify(config));
  closeSettings();
  showToast('✅ Configuración guardada');
  setStatus('listo');
}

function openSettings() {
  document.getElementById('modalOverlay').classList.add('open');
}

function closeSettings() {
  document.getElementById('modalOverlay').classList.remove('open');
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('modalOverlay')) closeSettings();
}

// ─── UI Helpers ───────────────────────────────────────────
function setStatus(text) {
  document.getElementById('statusText').textContent = text;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function updateSendBtn() {
  const val = document.getElementById('textInput').value.trim();
  document.getElementById('sendBtn').disabled = !val || isProcessing;
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!document.getElementById('sendBtn').disabled) sendMessage();
  }
}

function scrollToBottom() {
  const chat = document.getElementById('chat');
  setTimeout(() => chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' }), 50);
}

function getTime() {
  return new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
}

// ─── Mensajes ─────────────────────────────────────────────
function hideWelcome() {
  const w = document.getElementById('welcome');
  if (w) w.remove();
}

function addMessage(role, text) {
  hideWelcome();
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `
    <div class="bubble">${escapeHtml(text)}</div>
    <div class="msg-time">${getTime()}</div>
  `;
  chat.appendChild(div);
  scrollToBottom();
  return div;
}

function addTyping() {
  hideWelcome();
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.id = 'typing';
  div.innerHTML = `<div class="bubble"><div class="typing-indicator"><span></span><span></span><span></span></div></div>`;
  chat.appendChild(div);
  scrollToBottom();
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

function addAIMessage(text, audioBlob) {
  removeTyping();
  hideWelcome();
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg ai';

  let audioHTML = '';
  if (audioBlob) {
    const url = URL.createObjectURL(audioBlob);
    audioHTML = `<button class="audio-play-btn" onclick="playAudio('${url}', this)">▶ Reproducir respuesta</button>`;
  }

  div.innerHTML = `
    <div class="bubble">${escapeHtml(text)}${audioHTML ? '<br>' + audioHTML : ''}</div>
    <div class="msg-time">${getTime()}</div>
  `;
  chat.appendChild(div);
  scrollToBottom();

  if (audioBlob) {
    autoPlayAudio(audioBlob);
  }
}

function playAudio(url, btn) {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  currentAudio = new Audio(url);
  currentAudio.play();
  btn.textContent = '⏸ Reproduciendo...';
  currentAudio.onended = () => { btn.textContent = '▶ Reproducir respuesta'; };
}

function autoPlayAudio(blob) {
  if (currentAudio) { currentAudio.pause(); }
  const url = URL.createObjectURL(blob);
  currentAudio = new Audio(url);
  currentAudio.play().catch(() => {});
}

function escapeHtml(text) {
  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\n/g, '<br>');
}

// ─── Enviar mensaje de texto ───────────────────────────────
async function sendMessage() {
  const input = document.getElementById('textInput');
  const text = input.value.trim();
  if (!text || isProcessing) return;

  if (!config.claudeKey) {
    showToast('⚠️ Añade tu API Key en ⚙️');
    openSettings();
    return;
  }

  input.value = '';
  input.style.height = 'auto';
  updateSendBtn();
  addMessage('user', text);
  await processMessage(text, false);
}

function sendQuickMsg(text) {
  document.getElementById('textInput').value = text;
  updateSendBtn();
  sendMessage();
}

// ─── Grabación de voz ─────────────────────────────────────
async function startRecording(e) {
  e.preventDefault();
  if (isProcessing) return;

  if (!config.openaiKey) {
    showToast('⚠️ Añade tu API Key de OpenAI para voz');
    openSettings();
    return;
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream, { mimeType: getSupportedMimeType() });
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.start(100);
    isRecording = true;

    document.getElementById('voiceBtn').classList.add('recording');
    document.getElementById('recordingBar').classList.add('active');
    setStatus('grabando...');
  } catch(err) {
    showToast('❌ Sin acceso al micrófono. Permite el permiso en Safari.');
  }
}

async function stopRecording(e) {
  e.preventDefault();
  if (!isRecording || !mediaRecorder) return;

  isRecording = false;
  document.getElementById('voiceBtn').classList.remove('recording');
  document.getElementById('recordingBar').classList.remove('active');

  mediaRecorder.stop();
  mediaRecorder.stream.getTracks().forEach(t => t.stop());

  mediaRecorder.onstop = async () => {
    const mimeType = getSupportedMimeType();
    const blob = new Blob(audioChunks, { type: mimeType });

    if (blob.size < 1000) {
      showToast('Grabación muy corta, inténtalo de nuevo');
      setStatus('listo');
      return;
    }

    setStatus('transcribiendo...');
    const transcript = await transcribeAudio(blob);
    if (transcript) {
      addMessage('user', transcript);
      await processMessage(transcript, true);
    } else {
      setStatus('listo');
    }
  };
}

function getSupportedMimeType() {
  const types = ['audio/webm', 'audio/mp4', 'audio/ogg', 'audio/wav'];
  for (const t of types) {
    if (MediaRecorder.isTypeSupported(t)) return t;
  }
  return 'audio/webm';
}

// ─── Transcripción (Whisper) ──────────────────────────────
async function transcribeAudio(blob) {
  const formData = new FormData();
  const ext = blob.type.includes('mp4') ? 'mp4' : blob.type.includes('ogg') ? 'ogg' : blob.type.includes('wav') ? 'wav' : 'webm';
  formData.append('file', blob, `audio.${ext}`);
  formData.append('model', 'whisper-1');
  formData.append('language', 'es');

  try {
    const res = await fetch('https://api.openai.com/v1/audio/transcriptions', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${config.openaiKey}` },
      body: formData
    });
    const data = await res.json();
    if (data.text) return data.text.trim();
    showToast('❌ Error transcribiendo. Revisa tu API Key de OpenAI.');
    return null;
  } catch(err) {
    showToast('❌ Error de conexión con OpenAI');
    return null;
  }
}

// ─── Respuesta de Claude ───────────────────────────────────
async function processMessage(userText, speakResponse) {
  isProcessing = true;
  document.getElementById('sendBtn').disabled = true;
  setStatus('pensando...');
  addTyping();

  messages.push({ role: 'user', content: userText });

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': config.claudeKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-5',
        max_tokens: 1024,
        system: config.systemPrompt,
        messages: messages.slice(-20)
      })
    });

    const data = await res.json();

    if (data.content && data.content[0]) {
      const reply = data.content[0].text;
      messages.push({ role: 'assistant', content: reply });

      if (speakResponse && config.openaiKey) {
        setStatus('generando voz...');
        const audioBlob = await textToSpeech(reply);
        addAIMessage(reply, audioBlob);
      } else {
        addAIMessage(reply, null);
      }
      setStatus('listo');
    } else {
      removeTyping();
      showToast('❌ Error de Claude. Revisa tu API Key.');
      setStatus('error');
      if (data.error) console.error(data.error);
    }
  } catch(err) {
    removeTyping();
    showToast('❌ Error de conexión');
    setStatus('error');
    console.error(err);
  }

  isProcessing = false;
  updateSendBtn();
}

// ─── Texto a voz (OpenAI TTS) ─────────────────────────────
async function textToSpeech(text) {
  const MAX_CHARS = 4000;
  const truncated = text.length > MAX_CHARS ? text.substring(0, MAX_CHARS) + '...' : text;

  try {
    const res = await fetch('https://api.openai.com/v1/audio/speech', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${config.openaiKey}`
      },
      body: JSON.stringify({
        model: 'tts-1',
        input: truncated,
        voice: config.voice || 'nova'
      })
    });

    if (res.ok) {
      return await res.blob();
    }
    return null;
  } catch(err) {
    console.error('TTS error:', err);
    return null;
  }
}

// ─── Init ─────────────────────────────────────────────────
init();
</script>
